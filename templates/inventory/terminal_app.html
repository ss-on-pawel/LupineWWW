<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terminal inwentaryzacyjny</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            background: #f4f6f8;
            color: #101828;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input, select { font: inherit; }
        .terminal-shell {
            display: grid;
            min-height: 100vh;
            padding: 10px;
        }
        .terminal-panel {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            width: min(100%, 720px);
            min-height: calc(100vh - 20px);
            margin: 0 auto;
        }
        .terminal-top {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: start;
        }
        .terminal-id {
            display: grid;
            gap: 2px;
            min-width: 0;
        }
        .terminal-kicker,
        .terminal-label {
            margin: 0;
            color: #667085;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0;
            text-transform: uppercase;
        }
        .terminal-title {
            margin: 0;
            overflow: hidden;
            color: #101828;
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .terminal-status {
            min-height: 30px;
            padding: 6px 9px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
            color: #475467;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .terminal-status.is-online {
            border-color: #75c895;
            background: #ecfdf3;
            color: #166534;
        }
        .terminal-status.is-offline {
            border-color: #fdb022;
            background: #fffaeb;
            color: #92400e;
        }
        .terminal-card {
            display: grid;
            gap: 10px;
            padding: 12px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
        }
        .terminal-setup { align-self: center; }
        .terminal-scan-card { align-content: start; }
        .terminal-row {
            display: grid;
            gap: 6px;
        }
        .terminal-row input,
        .terminal-row select {
            width: 100%;
            min-height: 48px;
            padding: 8px 10px;
            border: 1px solid #98a2b3;
            background: #ffffff;
            color: #101828;
            font-size: 1rem;
        }
        .terminal-scan-input {
            height: 56px;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 1.1rem;
            font-weight: 800;
        }
        .terminal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .terminal-button {
            min-height: 46px;
            border: 1px solid #101828;
            background: #101828;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
        }
        .terminal-button.secondary {
            border-color: #98a2b3;
            background: #ffffff;
            color: #101828;
        }
        .terminal-counter {
            display: grid;
            place-items: center;
            min-height: 150px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
        }
        .terminal-counter-label {
            margin: 0 0 4px;
            color: #667085;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .terminal-counter-value {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: clamp(4rem, 22vw, 8rem);
            font-weight: 900;
            line-height: 0.95;
        }
        .terminal-last {
            display: grid;
            gap: 5px;
            padding: 12px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
        }
        .terminal-last-code {
            min-height: 38px;
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .terminal-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .terminal-meta {
            min-height: 64px;
            padding: 9px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
        }
        .terminal-meta-value {
            margin: 5px 0 0;
            overflow: hidden;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 1.05rem;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .terminal-message {
            min-height: 22px;
            margin: 0;
            color: #475467;
            font-size: 0.9rem;
            line-height: 1.35;
        }
        .terminal-message.is-error { color: #b42318; }
        .terminal-message.is-ok { color: #166534; }
        .terminal-tools summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
        .terminal-tools .terminal-row { margin-top: 10px; }
        .terminal-hidden, [hidden] { display: none !important; }
        @media (max-width: 480px) {
            .terminal-shell { padding: 6px; }
            .terminal-panel { min-height: calc(100vh - 12px); }
            .terminal-meta-grid,
            .terminal-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    {{ terminal_data|json_script:"terminal-data" }}
    <main class="terminal-shell" data-terminal-app>
        <section class="terminal-panel">
            <header class="terminal-top">
                <div class="terminal-id">
                    <p class="terminal-kicker" data-current-session>Terminal</p>
                    <h1 class="terminal-title" data-current-terminal>Inwentaryzacja</h1>
                </div>
                <span class="terminal-status" data-online-status>...</span>
            </header>

            <section class="terminal-card" data-startup-panel hidden>
                <p class="terminal-message is-error" data-startup-message></p>
                <button class="terminal-button" type="button" data-restart-button>Ponów uruchomienie</button>
            </section>
            <section class="terminal-card" data-auth-panel hidden>
                <p class="terminal-message" data-account-message></p>
                <div class="terminal-actions">
                    <a class="terminal-button" data-login-link hidden href="{% url 'inventory:terminal-login' %}">Zaloguj</a>
                    <button class="terminal-button secondary" type="button" data-resume-button hidden>Sprawdź logowanie</button>
                </div>
            </section>
            <section class="terminal-card terminal-setup" data-setup-panel>
                <div class="terminal-row">
                    <label class="terminal-label" for="terminal-session-select">Inwentaryzacja</label>
                    <select id="terminal-session-select" data-session-select></select>
                </div>
                <div class="terminal-row">
                    <label class="terminal-label" for="terminal-name-input">Terminal / zespół</label>
                    <input id="terminal-name-input" data-terminal-name type="text" autocomplete="off" placeholder="Terminal 1">
                </div>
                <div class="terminal-actions">
                    <button class="terminal-button" type="button" data-start-button>Start</button>
                    <button class="terminal-button secondary" type="button" data-refresh-button>Odśwież</button>
                </div>
                <p class="terminal-message" data-message>Ładowanie...</p>
            </section>

            <section class="terminal-card terminal-scan-card terminal-hidden" data-scan-panel>
                <div class="terminal-counter" aria-label="Licznik skanów">
                    <div>
                        <p class="terminal-counter-label">Licznik skanów</p>
                        <p class="terminal-counter-value" data-local-count>0</p>
                    </div>
                </div>
                <div class="terminal-last">
                    <p class="terminal-label">Ostatni skan</p>
                    <div class="terminal-last-code" data-last-scan>-</div>
                </div>
                <div class="terminal-meta-grid">
                    <div class="terminal-meta">
                        <p class="terminal-label">Do wysłania (wszystkie sesje)</p>
                        <p class="terminal-meta-value" data-pending-count>0</p>
                    </div>
                    <div class="terminal-meta">
                        <p class="terminal-label">Lokalizacja</p>
                        <p class="terminal-meta-value" data-current-location>-</p>
                    </div>
                </div>
                <div class="terminal-row">
                    <label class="terminal-label" for="terminal-scan-input">Pole skanowania</label>
                    <input id="terminal-scan-input" class="terminal-scan-input" data-scan-input type="text" inputmode="none" autocomplete="off" autofocus>
                </div>
                <div class="terminal-actions">
                    <button class="terminal-button" type="button" data-sync-button>Synchronizuj</button>
                </div>
                <button class="terminal-button secondary" type="button" data-retry-save hidden>Ponów zapis</button>
                <p class="terminal-message" data-scan-message>Gotowy.</p>
            </section>
            <details class="terminal-card terminal-tools" data-tools-panel>
                <summary>Opcje terminala</summary>
                <div class="terminal-row">
                    <button class="terminal-button secondary" type="button" data-change-session-button>Zmień sesję</button>
                    <button class="terminal-button secondary" type="button" data-backup-button disabled>Pobierz kopię TXT</button>
                    <a class="terminal-button secondary" data-backup-download hidden>Zapisz plik TXT</a>
                    <button class="terminal-button secondary" type="button" data-logout-button disabled>Wyloguj</button>
                </div>
                <details>
                    <summary>Pamięć offline</summary>
                    <p class="terminal-message" data-memory-status>Sprawdzanie pamięci urządzenia...</p>
                </details>
            </details>
        </section>
    </main>

    <script src="{{ terminal_data.client_url }}" defer></script>
</body>
</html>
